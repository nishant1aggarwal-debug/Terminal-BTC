# Render.com one-click deploy config.
#
# After clicking "Deploy to Render" (see the link in README.md), Render reads
# this file, builds the Docker image, and gives you a public HTTPS URL.
#
# Free tier note: disks are not available on free services, so the SQLite DB
# lives inside the container — it resets on every redeploy (but survives normal
# restarts). Fine for paper trading + the self-rebuilding backtest/F&G caches.
# Upgrade the plan to 'starter' (~$7/mo) if you want persistent history.

services:
  - type: web
    name: terminal-btc
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PAPER_MODE
        value: "true"
      - key: LIVE_TRADING
        value: "false"
      - key: SIGNAL_MODE
        value: rules
      # IMPORTANT: Bybit and Binance block datacenter IPs from some clouds.
      # Kraken is the safest default for Render/Railway/Fly deploys. Switch
      # to bybit/binance only when running locally.
      # Data source picks the exchange used for OHLCV, tickers, and order books.
      # Bybit + Binance block AWS US datacenter IPs (Render free tier sits in
      # us-east/us-west AWS), so we default to a wide-universe alternative that
      # works from datacenters: mexc (~600 USDT futures), bitget (~500),
      # gateio (~400), kraken (~14, the rock-solid fallback). When you set
      # AUTO_DISCOVER_SYMBOLS=true, the trade universe expands to top-N pairs
      # automatically — no manual TRADE_SYMBOLS list to maintain.
      - key: DATA_SOURCE
        value: mexc
      - key: AUTO_DISCOVER_SYMBOLS
        value: "true"
      - key: AUTO_DISCOVER_TOP_N
        value: "25"
      - key: PAPER_STARTING_EQUITY_USDT
        value: "5000"
      - key: POLL_INTERVAL_SEC
        value: "300"
      # Bybit-futures-style defaults, explicitly pinned so they survive
      # redeploys regardless of Python code changes.
      - key: TRADE_MARKET
        value: futures
      - key: LEVERAGE
        value: "10"
      - key: MARGIN_MODE
        value: isolated
      - key: MAX_OPEN_POSITIONS
        value: "15"
      - key: MAX_POSITION_USDT
        value: "500"
      - key: MAX_DAILY_LOSS_USDT
        value: "250"
      - key: MIN_SIGNAL_CONFIDENCE
        value: "0.55"
      # 34-pair alt-heavy universe. filter_supported() drops Kraken-unlisted
      # pairs automatically (~25 will actually trade on Kraken, all ~34 on
      # Bybit/Binance).
      - key: TRADE_SYMBOLS
        value: "BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT,DOGE/USDT,ADA/USDT,AVAX/USDT,LINK/USDT,BNB/USDT,TON/USDT,TRX/USDT,LTC/USDT,DOT/USDT,MATIC/USDT,NEAR/USDT,APT/USDT,ATOM/USDT,FIL/USDT,HBAR/USDT,ARB/USDT,OP/USDT,SUI/USDT,SEI/USDT,INJ/USDT,TIA/USDT,UNI/USDT,AAVE/USDT,MKR/USDT,CRV/USDT,LDO/USDT,XLM/USDT,ALGO/USDT,XTZ/USDT,ETC/USDT,SAND/USDT,MANA/USDT,AXS/USDT"
      - key: SYMBOL_ALLOWLIST
        value: "BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT,DOGE/USDT,ADA/USDT,AVAX/USDT,LINK/USDT,BNB/USDT,TON/USDT,TRX/USDT,LTC/USDT,DOT/USDT,MATIC/USDT,NEAR/USDT,APT/USDT,ATOM/USDT,FIL/USDT,HBAR/USDT,ARB/USDT,OP/USDT,SUI/USDT,SEI/USDT,INJ/USDT,TIA/USDT,UNI/USDT,AAVE/USDT,MKR/USDT,CRV/USDT,LDO/USDT,COMP/USDT,SNX/USDT,XLM/USDT,ALGO/USDT,XTZ/USDT,ETC/USDT,ICP/USDT,FLOW/USDT,KSM/USDT,EGLD/USDT,SAND/USDT,MANA/USDT,AXS/USDT,IMX/USDT,GALA/USDT,APE/USDT,CHZ/USDT,RUNE/USDT,GRT/USDT,RNDR/USDT,FET/USDT,THETA/USDT,SHIB/USDT,PEPE/USDT,WIF/USDT,BONK/USDT,FLOKI/USDT,JUP/USDT,PYTH/USDT,JTO/USDT,ORDI/USDT"
      - key: TRADINGVIEW_WEBHOOK_SECRET
        generateValue: true
